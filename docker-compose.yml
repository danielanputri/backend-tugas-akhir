
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api
    restart: unless-stopped # Otomatis restart jika app crash atau VPS restart
    # Port 8000 TIDAK di-expose ke publik, hanya bisa diakses via nginx di jaringan internal
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      # Mapping folder ini penting agar saat container update/restart, 
      # model AI yang sudah ditraining dan data upload tidak hilang.
      - ./app/ml_models:/app/app/ml_models
      - ./data/uploads:/app/data/uploads
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          # Limit krusial untuk VPS 1 Core 1GB RAM:
          # Mencegah container menggunakan 100% CPU yang bikin server VPS nge-hang (SSH gak bisa masuk).
          cpus: '0.80'  # Sisakan ~20% untuk OS + nginx
          # Mencegah container OOM (Out of Memory) dan membuat VPS mati total.
          memory: 800M  # Sisakan ~200MB untuk OS + nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: backend-nginx
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP - publik
    depends_on:
      - api       # Pastikan api sudah jalan sebelum nginx start
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 50M   # Nginx Alpine sangat ringan
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  backend-net:
    driver: bridge  # Jaringan internal antar container
