
# Rate limiting zone - mencegah spam/DDoS sederhana
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name daniela.nasrulfahmi.my.id;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression untuk hemat bandwidth
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # Batasi ukuran request body (sesuaikan jika perlu upload file besar)
    client_max_body_size 20M;

    location / {
        # Rate limiting: burst 50 request, tanpa delay
        limit_req zone=api_limit burst=50 nodelay;

        # CORS headers - selalu ada meski backend error
        set $cors_origin "";
        if ($http_origin ~* "^https://prediksi-pengadaan-kds\.vercel\.app$") {
            set $cors_origin $http_origin;
        }
        if ($http_origin ~* "^http://localhost(:[0-9]+)?$") {
            set $cors_origin $http_origin;
        }

        # Handle preflight OPTIONS request
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://api:8000;

        # Header penting agar backend tahu IP asli client
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;  # lebih panjang untuk endpoint AI

        # Buffer settings untuk mengurangi beban CPU di VPS kecil
        proxy_buffering        on;
        proxy_buffer_size      8k;
        proxy_buffers          8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Health check endpoint langsung dari nginx (tanpa hit backend)
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
